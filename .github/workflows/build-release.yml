# Baut und testet PandocUi für Windows, macOS, Debian und Rocky Linux.
# Bei einem Versions-Tag (z. B. v0.2.0) werden die Pakete als GitHub-Release veröffentlicht:
#
#   git tag v0.2.0
#   git push origin v0.2.0
#
name: Build und Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  # Windows: statisch gebautes Qt (LTS-Reihe 6.8), siehe ci/build-qt-static.ps1.
  # Debian 13 bringt Qt 6.8, Rocky Linux 10 Qt 6.10 selbst mit.
  QT_STATIC_VERSION: '6.8.5'
  # macOS: Qt 6.8.3 verlinkt das AGL-Framework, das im macOS-26-SDK fehlt; ab 6.10 behoben
  QT_VERSION_MACOS: '6.10.*'

jobs:
  version:
    name: Version bestimmen
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: version
        name: Version aus Tag bzw. CMakeLists.txt
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Der Tag '$GITHUB_REF_NAME' hat nicht die Form vX.Y.Z"
              exit 1
            fi
          else
            version="$(sed -n 's/^set(PANDOCUI_PROJECT_VERSION \([0-9.]*\))$/\1/p' CMakeLists.txt)"
          fi
          echo "Version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  linux:
    name: ${{ matrix.name }}
    needs: version
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debian 13
            image: debian:13
            artifact: debian13
          - name: Rocky Linux 10
            image: rockylinux/rockylinux:10
            artifact: rocky10
    env:
      PANDOCUI_RELEASE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - name: Bauen, testen, paketieren
        run: bash ci/build-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: pandocui-${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

  windows:
    name: Windows
    needs: version
    runs-on: windows-latest
    env:
      PANDOCUI_RELEASE_VERSION: ${{ needs.version.outputs.version }}
      QT_STATIC_DIR: C:\qt-static
    steps:
      - uses: actions/checkout@v5
      - name: Visual-Studio-Version für den Cache-Schlüssel
        id: vs
        shell: powershell
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $version = & $vswhere -latest -property installationVersion
          # Add-Content schreibt ohne BOM (Out-File -Encoding utf8 würde den Schlüssel verfälschen)
          Add-Content -Path $env:GITHUB_OUTPUT -Value "major=$($version.Split('.')[0])"
      - name: Statisches Qt aus dem Cache
        id: qt-cache
        uses: actions/cache/restore@v4
        with:
          path: C:\qt-static
          key: qt-static-${{ env.QT_STATIC_VERSION }}-vs${{ steps.vs.outputs.major }}-${{ hashFiles('ci/build-qt-static.ps1', 'ci/windows-env.ps1') }}
      - name: Statisches Qt bauen (nur ohne Cache, etwa eine Stunde)
        if: steps.qt-cache.outputs.cache-hit != 'true'
        shell: powershell
        run: .\ci\build-qt-static.ps1 -Version $env:QT_STATIC_VERSION -Prefix $env:QT_STATIC_DIR -WorkDir "$env:RUNNER_TEMP\qtb"
      - name: Statisches Qt im Cache ablegen
        if: steps.qt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: C:\qt-static
          key: ${{ steps.qt-cache.outputs.cache-primary-key }}
      - name: pandoc für den Ende-zu-Ende-Test installieren
        shell: powershell
        run: |
          choco install pandoc --no-progress -y
          "C:\Program Files\Pandoc" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Bauen, testen, bereitstellen
        shell: powershell
        run: .\build.ps1 -QtDir $env:QT_STATIC_DIR -DeployDir dist\PandocUi
      - name: Testfunktionen einzeln ausführen (Diagnose bei Fehlern)
        if: failure()
        shell: powershell
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          $exe = 'build\windows-release-static\tst_pandocui.exe'
          if (-not (Test-Path $exe)) { Write-Host "Kein Testprogramm gebaut."; exit 0 }
          $failed = @()
          foreach ($line in (& $exe -functions)) {
              $name = $line.Trim() -replace '\(\)$', ''
              if (-not $name) { continue }
              $log = "test-$name.txt"
              & $exe $name -v2 -maxwarnings 0 -o "$log,txt"
              $code = $LASTEXITCODE
              Write-Host ("===== {0}: Exit-Code 0x{1:X8}" -f $name, $code)
              if ($code -ne 0) {
                  $failed += $name
                  if (Test-Path $log) { Get-Content $log -Tail 60 | ForEach-Object { Write-Host "  $_" } }
              }
          }

          # Abgestürzte Funktionen mit Page Heap unter dem Debugger wiederholen:
          # er hält an der Stelle an, an der der Speicher beschädigt wird.
          $debuggers = "${env:ProgramFiles(x86)}\Windows Kits\10\Debuggers\x64"
          if ($failed -and (Test-Path "$debuggers\cdb.exe")) {
              & "$debuggers\gflags.exe" /p /enable tst_pandocui.exe /full | Out-Null
              foreach ($name in $failed) {
                  Write-Host "===== Stacktrace für $name"
                  & "$debuggers\cdb.exe" -lines -y "build\windows-release-static" `
                      -c ".lines -e; g; .ecxr; kP 40; q" $exe $name -maxwarnings 0 |
                      Select-String -Pattern 'tst_pandocui|pandocui|Qt6|ntdll|Exception|exception|^\s*[0-9a-f]{2} ' |
                      Select-Object -First 120 | ForEach-Object { Write-Host $_.Line }
              }
              & "$debuggers\gflags.exe" /p /disable tst_pandocui.exe | Out-Null
          }
          exit 0
      - name: Release-Datei bereitstellen
        shell: powershell
        run: |
          $exe = "dist\PandocUi-$env:PANDOCUI_RELEASE_VERSION-windows-x64.exe"
          Copy-Item dist\PandocUi\PandocUi.exe $exe
          # Prüfen, dass wirklich keine Qt-DLLs gebraucht werden
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $dumpbin = @(& $vswhere -latest -find 'VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe')[0]
          if ($dumpbin) {
              $deps = & $dumpbin /dependents $exe | Where-Object { $_ -match '^\s+\S+\.dll$' } | ForEach-Object { $_.Trim() }
              Write-Host "Abhängige DLLs: $($deps -join ', ')"
              $bad = $deps | Where-Object { $_ -match '^(Qt6|MSVCP|VCRUNTIME)' }
              if ($bad) { Write-Host "::error::Unerwartete Abhängigkeiten: $($bad -join ', ')"; exit 1 }
          }
          Get-Item $exe
      - uses: actions/upload-artifact@v4
        with:
          name: pandocui-windows
          path: dist/*.exe
          if-no-files-found: error

  macos:
    name: macOS
    needs: version
    runs-on: macos-26
    env:
      PANDOCUI_RELEASE_VERSION: ${{ needs.version.outputs.version }}
      # Universal-Binary für Apple Silicon und Intel; Qt 6.10 unterstützt ab macOS 13
      CMAKE_OSX_ARCHITECTURES: arm64;x86_64
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@v5
      - name: Qt installieren
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION_MACOS }}
          host: mac
          target: desktop
          arch: clang_64
          cache: true
      - name: Ninja und pandoc (für den Ende-zu-Ende-Test) installieren
        run: brew install ninja pandoc
      - name: Bauen und testen
        run: |
          sw_vers
          export CMAKE_PREFIX_PATH="$QT_ROOT_DIR"
          bash build.sh --build-dir build/macos
      - name: App-Bundle bereitstellen und DMG erstellen
        run: |
          app=build/macos/PandocUi.app
          "$QT_ROOT_DIR/bin/macdeployqt" "$app"
          # macdeployqt verändert die Binärdateien: neu (ad hoc) signieren,
          # sonst startet die App auf Apple Silicon nicht
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict "$app"
          echo "Architekturen: $(lipo -archs "$app/Contents/MacOS/PandocUi")"

          staging=build/dmg
          rm -rf "$staging" && mkdir -p "$staging" dist
          cp -R "$app" "$staging/"
          ln -s /Applications "$staging/Applications"
          hdiutil create -volname "PandocUi $PANDOCUI_RELEASE_VERSION" -srcfolder "$staging" \
            -ov -format UDZO "dist/PandocUi-$PANDOCUI_RELEASE_VERSION-macos-universal.dmg"
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: pandocui-macos
          path: dist/*.dmg
          if-no-files-found: error

  release:
    name: GitHub-Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, linux, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Prüfsummen
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # Erneuter Lauf: vorhandene Dateien ersetzen
            gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "PandocUi $VERSION" \
              --generate-notes \
              --verify-tag
          fi
